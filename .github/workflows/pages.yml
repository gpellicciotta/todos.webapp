# Tests the app, then publishes src/ to GitHub Pages (TEC-11).
# The app has no build step: the deployed artifact is src/ as committed, plus the help files that scripts/stage-site.mjs adds.
# See docs/devops.md for the one-time Pages setup and the release procedure.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The default token reads the repository only; the deploy job widens it for Pages.
permissions:
  contents: read

# One deployment at a time; a newer run waits instead of cancelling a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node.js 22 is the oldest line that package.json engines (>=22.13) accepts.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Playwright Chromium build
        run: npx playwright install --with-deps chromium

      - name: Check the service worker VERSION bump
        run: npm run check:sw

      # The vendored support.webapp copy must match its manifest, and the app styles must conform to it.
      - name: Check the vendored design system
        run: node src/vendor/design/bin/check.mjs

      - name: Run the unit tests
        run: npm test

      - name: Run the linter
        run: npm run lint

      - name: Run the end-to-end tests
        run: npm run test:e2e

      # 5000 tasks under 4x CPU throttling. The throttle scales the runner's own CPU, so slow runners
      # can miss the 200 ms budget; the step reports numbers without blocking deploys. Gate locally.
      - name: Run the performance test (report only)
        run: npm run test:perf
        continue-on-error: true

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Copies src/ and adds the help docs and the changelog under help/, so no copies live in the repository.
      - name: Stage the site
        run: node scripts/stage-site.mjs _site

      - name: Upload the staged site as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
