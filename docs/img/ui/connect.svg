<svg xmlns="http://www.w3.org/2000/svg" width="1970" height="1050" viewBox="0 0 1970 1050">
  <title>Connect wireframe</title>
  <style>
text { font-family: sans-serif; fill: #222222; }
.muted { fill: #666666; }
.on-primary { fill: #ffffff; }
.bold { font-weight: bold; }
rect.frame { fill: #ffffff; stroke: #444444; stroke-width: 2; }
.bar { fill: #eeeeee; stroke: #bbbbbb; }
.box { fill: #f5f5f5; stroke: #bbbbbb; }
.control { fill: #ffffff; stroke: #888888; }
.disabled { fill: #f5f5f5; stroke: #cccccc; }
.primary { fill: #444444; stroke: #444444; }
.selected { fill: #dddddd; stroke: #999999; }
.chip { fill: #eeeeee; stroke: #cccccc; }
.signal { fill: #ffffff; stroke: #222222; stroke-width: 2; }
.scrim { fill: #888888; fill-opacity: 0.5; }
.rule { stroke: #cccccc; }
.drop { stroke: #222222; stroke-width: 3; }
.icon { fill: #ffffff; stroke: #444444; stroke-width: 2; }
.icon-fill { fill: #444444; stroke: #444444; stroke-width: 2; }
.icon-mark { fill: none; stroke: #ffffff; stroke-width: 2; }
.icon-line { stroke: #444444; stroke-width: 2; }
.icon-line-open { fill: none; stroke: #444444; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-dashed { fill: #ffffff; stroke: #444444; stroke-width: 2; stroke-dasharray: 3 3; }
.meter { fill: #dddddd; stroke: none; }
.meter-fill { fill: #444444; stroke: none; }
.tooltip { fill: #222222; stroke: #222222; }
  </style>
  <rect x="0" y="0" width="1970" height="1050" fill="#ffffff"/>
  <text x="40" y="44" font-size="28" class="bold">Connect</text>
  <text x="40" y="72" font-size="16" class="muted">After sign-in, the Connection section uploads local data; same-named lists merge.</text>
  <text x="40" y="98" font-size="14" class="muted">Compact · 390 px</text>
  <text x="490" y="98" font-size="14" class="muted">Wide · 1440 px</text>
  <g class="frame" data-width="390" data-height="844" transform="translate(40 110)">
    <rect x="0" y="0" width="390" height="844" rx="0" class="frame"/>
    <rect x="0" y="0" width="390" height="60" rx="0" class="bar"/>
    <rect x="8" y="8" width="44" height="44" rx="6" class="control"/>
    <text x="30" y="35" font-size="16" text-anchor="middle">&lt;</text>
    <circle cx="360" cy="30" r="22" class="icon-fill"/>
    <text x="360" y="35" font-size="14" class="on-primary bold" text-anchor="middle">JD</text>
    <path d="M 309 38 H 323 A 5 5 0 0 0 323 28 A 8 8 0 0 0 309 30 A 4 4 0 0 0 309 38 Z" class="icon-line-open"/>
    <text x="60" y="37" font-size="20" class="bold">Settings</text>
    <rect x="12" y="72" width="366" height="520" rx="8" class="box"/>
    <text x="28" y="102" font-size="16" class="bold">Connection</text>
    <text x="28" y="130" font-size="14">Connecting syncs your data across devices</text>
    <text x="28" y="152" font-size="14">and lets you share lists.</text>
    <text x="28" y="174" font-size="14" class="muted">It needs an account, so you are</text>
    <text x="28" y="196" font-size="14" class="muted">no longer anonymous. Access is by invitation.</text>
    <circle cx="40" cy="236" r="12" class="icon"/>
    <text x="40" y="241" font-size="13" class="bold" text-anchor="middle">✓</text>
    <text x="64" y="241" font-size="14">Signed in as jane@example.com</text>
    <circle cx="40" cy="272" r="12" class="icon"/>
    <text x="40" y="277" font-size="13" class="bold" text-anchor="middle">…</text>
    <text x="64" y="277" font-size="14">Uploading 5 lists and 34 tasks</text>
    <rect x="28" y="304" width="334" height="12" rx="6" class="control"/>
    <rect x="28" y="304" width="200.4" height="12" rx="6" class="primary"/>
    <text x="362" y="336" font-size="12" class="muted" text-anchor="end">21 of 34 tasks</text>
    <text x="28" y="374" font-size="14">Home merged into the account's Home.</text>
    <text x="28" y="398" font-size="13" class="muted">Next: download the account's data.</text>
    <rect x="28" y="416" width="63.36" height="44" rx="6" class="disabled"/>
    <text x="59.68" y="442.9" font-size="14" text-anchor="middle">Done</text>
    <rect x="0" y="780" width="390" height="64" rx="0" class="bar"/>
    <rect x="88.5" y="794" width="18" height="18" rx="3" class="icon"/>
    <text x="97.5" y="828" font-size="12" text-anchor="middle">Tasks</text>
    <rect x="283.5" y="794" width="18" height="18" rx="3" class="icon"/>
    <text x="292.5" y="828" font-size="12" text-anchor="middle">Lists</text>
  </g>
  <g class="frame" data-width="1440" data-height="900" transform="translate(490 110)">
    <rect x="0" y="0" width="1440" height="900" rx="0" class="frame"/>
    <rect x="0" y="0" width="264" height="900" rx="0" class="bar"/>
    <rect x="12" y="22" width="44" height="44" rx="6" class="control"/>
    <path d="M 25 37 H 43" class="icon-line-open"/>
    <path d="M 25 44 H 43" class="icon-line-open"/>
    <path d="M 25 51 H 43" class="icon-line-open"/>
    <text x="28" y="106" font-size="14">All tasks</text>
    <text x="236" y="106" font-size="13" class="muted" text-anchor="end">24</text>
    <text x="28" y="150" font-size="14">Lists</text>
    <text x="44" y="194" font-size="14">Home</text>
    <text x="236" y="194" font-size="13" class="muted" text-anchor="end">9</text>
    <text x="44" y="238" font-size="14">Work</text>
    <text x="236" y="238" font-size="13" class="muted" text-anchor="end">12</text>
    <text x="44" y="282" font-size="14">Travel</text>
    <text x="236" y="282" font-size="13" class="muted" text-anchor="end">3</text>
    <text x="44" y="326" font-size="14">Errands</text>
    <text x="236" y="326" font-size="13" class="muted" text-anchor="end">5</text>
    <text x="44" y="370" font-size="14">Reading</text>
    <text x="236" y="370" font-size="13" class="muted" text-anchor="end">2</text>
    <circle cx="1082" cy="44" r="22" class="icon-fill"/>
    <text x="1082" y="49" font-size="14" class="on-primary bold" text-anchor="middle">JD</text>
    <path d="M 1031 52 H 1045 A 5 5 0 0 0 1045 42 A 8 8 0 0 0 1031 44 A 4 4 0 0 0 1031 52 Z" class="icon-line-open"/>
    <text x="304" y="60" font-size="28" class="bold">Settings</text>
    <rect x="304" y="96" width="640" height="500" rx="8" class="box"/>
    <text x="320" y="126" font-size="16" class="bold">Connection</text>
    <text x="320" y="154" font-size="14">Connecting syncs your data across devices</text>
    <text x="320" y="176" font-size="14">and lets you share lists.</text>
    <text x="320" y="198" font-size="14" class="muted">It needs an account, so you are</text>
    <text x="320" y="220" font-size="14" class="muted">no longer anonymous. Access is by invitation.</text>
    <circle cx="332" cy="260" r="12" class="icon"/>
    <text x="332" y="265" font-size="13" class="bold" text-anchor="middle">✓</text>
    <text x="356" y="265" font-size="14">Signed in as jane@example.com</text>
    <circle cx="332" cy="296" r="12" class="icon"/>
    <text x="332" y="301" font-size="13" class="bold" text-anchor="middle">…</text>
    <text x="356" y="301" font-size="14">Uploading 5 lists and 34 tasks</text>
    <rect x="320" y="328" width="560" height="12" rx="6" class="control"/>
    <rect x="320" y="328" width="336" height="12" rx="6" class="primary"/>
    <text x="880" y="360" font-size="12" class="muted" text-anchor="end">21 of 34 tasks</text>
    <text x="320" y="398" font-size="14">Home merged into the account's Home.</text>
    <text x="320" y="422" font-size="13" class="muted">Next: download the account's data.</text>
    <rect x="320" y="440" width="63.36" height="44" rx="6" class="disabled"/>
    <text x="351.68" y="466.9" font-size="14" text-anchor="middle">Done</text>
  </g>
</svg>
