<svg xmlns="http://www.w3.org/2000/svg" width="1970" height="1050" viewBox="0 0 1970 1050">
  <title>Connect wireframe</title>
  <style>
text { font-family: sans-serif; fill: #222222; }
.muted { fill: #666666; }
.on-primary { fill: #ffffff; }
.bold { font-weight: bold; }
rect.frame { fill: #ffffff; stroke: #444444; stroke-width: 2; }
.bar { fill: #eeeeee; stroke: #bbbbbb; }
.box { fill: #f5f5f5; stroke: #bbbbbb; }
.control { fill: #ffffff; stroke: #888888; }
.disabled { fill: #f5f5f5; stroke: #cccccc; }
.primary { fill: #444444; stroke: #444444; }
.selected { fill: #dddddd; stroke: #999999; }
.chip { fill: #eeeeee; stroke: #cccccc; }
.signal { fill: #ffffff; stroke: #222222; stroke-width: 2; }
.scrim { fill: #888888; fill-opacity: 0.5; }
.rule { stroke: #cccccc; }
.drop { stroke: #222222; stroke-width: 3; }
.icon { fill: #ffffff; stroke: #444444; stroke-width: 2; }
.icon-fill { fill: #444444; stroke: #444444; stroke-width: 2; }
.icon-mark { fill: none; stroke: #ffffff; stroke-width: 2; }
.icon-line { stroke: #444444; stroke-width: 2; }
.icon-line-open { fill: none; stroke: #444444; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect x="0" y="0" width="1970" height="1050" fill="#ffffff"/>
  <text x="40" y="44" font-size="28" class="bold">Connect</text>
  <text x="40" y="72" font-size="16" class="muted">After sign-in, local data uploads into the account; same-named lists merge.</text>
  <text x="40" y="98" font-size="14" class="muted">Compact · 390 px</text>
  <text x="490" y="98" font-size="14" class="muted">Wide · 1440 px</text>
  <g class="frame" data-width="390" data-height="844" transform="translate(40 110)">
    <rect x="0" y="0" width="390" height="844" rx="0" class="frame"/>
    <rect x="0" y="0" width="390" height="60" rx="0" class="bar"/>
    <rect x="8" y="8" width="44" height="44" rx="6" class="control"/>
    <text x="30" y="35" font-size="16" text-anchor="middle">&lt;</text>
    <circle cx="360" cy="30" r="22" class="icon-fill"/>
    <text x="360" y="35" font-size="14" class="on-primary bold" text-anchor="middle">JD</text>
    <rect x="286" y="8" width="44" height="44" rx="6" class="control"/>
    <text x="308" y="35" font-size="16" text-anchor="middle">⋮</text>
    <text x="60" y="37" font-size="20" class="bold">Connect</text>
    <text x="16" y="98" font-size="14">Connecting syncs your data across devices</text>
    <text x="16" y="120" font-size="14">and lets you share lists.</text>
    <text x="16" y="142" font-size="14" class="muted">It needs an account, so you are</text>
    <text x="16" y="164" font-size="14" class="muted">no longer anonymous. Access is by invitation.</text>
    <circle cx="28" cy="204" r="12" class="icon"/>
    <text x="28" y="209" font-size="13" class="bold" text-anchor="middle">✓</text>
    <text x="52" y="209" font-size="14">Signed in as jane@example.com</text>
    <circle cx="28" cy="240" r="12" class="icon"/>
    <text x="28" y="245" font-size="13" class="bold" text-anchor="middle">…</text>
    <text x="52" y="245" font-size="14">Uploading 5 lists and 34 tasks</text>
    <rect x="16" y="272" width="358" height="12" rx="6" class="control"/>
    <rect x="16" y="272" width="214.8" height="12" rx="6" class="primary"/>
    <text x="374" y="304" font-size="12" class="muted" text-anchor="end">21 of 34 tasks</text>
    <text x="16" y="342" font-size="14">Home merged into the account's Home.</text>
    <text x="16" y="366" font-size="13" class="muted">Next: download the account's data.</text>
    <rect x="16" y="384" width="63.36" height="44" rx="6" class="disabled"/>
    <text x="47.68" y="410.9" font-size="14" text-anchor="middle">Done</text>
    <rect x="0" y="780" width="390" height="64" rx="0" class="bar"/>
    <rect x="88.5" y="794" width="18" height="18" rx="3" class="icon"/>
    <text x="97.5" y="828" font-size="12" text-anchor="middle">Tasks</text>
    <rect x="283.5" y="794" width="18" height="18" rx="3" class="icon"/>
    <text x="292.5" y="828" font-size="12" text-anchor="middle">Lists</text>
  </g>
  <g class="frame" data-width="1440" data-height="900" transform="translate(490 110)">
    <rect x="0" y="0" width="1440" height="900" rx="0" class="frame"/>
    <rect x="0" y="0" width="264" height="900" rx="0" class="bar"/>
    <text x="24" y="46" font-size="22" class="bold">ToDo's</text>
    <text x="28" y="106" font-size="14">All tasks</text>
    <text x="236" y="106" font-size="13" class="muted" text-anchor="end">24</text>
    <text x="28" y="150" font-size="14">Lists</text>
    <text x="44" y="194" font-size="14">Home</text>
    <text x="236" y="194" font-size="13" class="muted" text-anchor="end">8</text>
    <text x="44" y="238" font-size="14">Work</text>
    <text x="236" y="238" font-size="13" class="muted" text-anchor="end">12</text>
    <text x="44" y="282" font-size="14">Travel</text>
    <text x="236" y="282" font-size="13" class="muted" text-anchor="end">3</text>
    <text x="44" y="326" font-size="14">Errands</text>
    <text x="236" y="326" font-size="13" class="muted" text-anchor="end">5</text>
    <text x="44" y="370" font-size="14">Reading</text>
    <text x="236" y="370" font-size="13" class="muted" text-anchor="end">2</text>
    <text x="44" y="414" font-size="14">+ New list</text>
    <circle cx="1082" cy="44" r="22" class="icon-fill"/>
    <text x="1082" y="49" font-size="14" class="on-primary bold" text-anchor="middle">JD</text>
    <text x="304" y="60" font-size="28" class="bold">Connect</text>
    <text x="304" y="114" font-size="14">Connecting syncs your data across devices</text>
    <text x="304" y="136" font-size="14">and lets you share lists.</text>
    <text x="304" y="158" font-size="14" class="muted">It needs an account, so you are</text>
    <text x="304" y="180" font-size="14" class="muted">no longer anonymous. Access is by invitation.</text>
    <circle cx="316" cy="220" r="12" class="icon"/>
    <text x="316" y="225" font-size="13" class="bold" text-anchor="middle">✓</text>
    <text x="340" y="225" font-size="14">Signed in as jane@example.com</text>
    <circle cx="316" cy="256" r="12" class="icon"/>
    <text x="316" y="261" font-size="13" class="bold" text-anchor="middle">…</text>
    <text x="340" y="261" font-size="14">Uploading 5 lists and 34 tasks</text>
    <rect x="304" y="288" width="560" height="12" rx="6" class="control"/>
    <rect x="304" y="288" width="336" height="12" rx="6" class="primary"/>
    <text x="864" y="320" font-size="12" class="muted" text-anchor="end">21 of 34 tasks</text>
    <text x="304" y="358" font-size="14">Home merged into the account's Home.</text>
    <text x="304" y="382" font-size="13" class="muted">Next: download the account's data.</text>
    <rect x="304" y="400" width="63.36" height="44" rx="6" class="disabled"/>
    <text x="335.68" y="426.9" font-size="14" text-anchor="middle">Done</text>
  </g>
</svg>
