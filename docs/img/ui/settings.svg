    <text x="83.6667" y="140.55" font-size="13" class="bold" text-anchor="middle">System</text>
    <text x="195" y="140.55" font-size="13" text-anchor="middle">Light</text>
    <text x="306.333" y="140.55" font-size="13" text-anchor="middle">Dark</text>
    <rect x="12" y="184" width="366" height="100" rx="8" class="box"/>
    <text x="28" y="214" font-size="16" class="bold">Data</text>
    <rect x="28" y="228" width="133.92" height="44" rx="6" class="control"/>
