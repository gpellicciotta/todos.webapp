    <circle cx="1082" cy="39" r="5" class="icon"/>
    <path d="M 1073 56 Q 1082 40 1091 56" class="icon-line"/>
    <path d="M 1031 52 H 1045 A 5 5 0 0 0 1045 42 A 8 8 0 0 0 1031 44 A 4 4 0 0 0 1031 52 Z" class="icon-line-open"/>
    <text x="304" y="60" font-size="28" class="bold">Settings</text>
    <rect x="304" y="96" width="640" height="100" rx="8" class="box"/>
    <text x="320" y="126" font-size="16" class="bold">Appearance</text>
    <rect x="320" y="140" width="608" height="40" rx="6" class="control"/>
    <rect x="322" y="142" width="198.667" height="36" rx="4" class="selected"/>
    <text x="421.333" y="164.55" font-size="13" class="bold" text-anchor="middle">System</text>
    <text x="624" y="164.55" font-size="13" text-anchor="middle">Light</text>
    <text x="826.667" y="164.55" font-size="13" text-anchor="middle">Dark</text>
    <rect x="304" y="208" width="640" height="112" rx="8" class="box"/>
    <text x="320" y="238" font-size="16" class="bold">Adding tasks</text>
    <rect x="320" y="256" width="40" height="24" rx="12" class="primary"/>
    <circle cx="348" cy="268" r="9" class="icon"/>
    <text x="372" y="273" font-size="14">Make Enter add</text>
    <text x="320" y="304" font-size="13" class="muted">Shift+Enter and Alt+Enter always add.</text>
    <rect x="304" y="332" width="640" height="214" rx="8" class="box"/>
    <text x="320" y="362" font-size="16" class="bold">Reminders</text>
    <rect x="320" y="380" width="40" height="24" rx="12" class="disabled"/>
    <circle cx="332" cy="392" r="9" class="icon"/>
    <text x="372" y="397" font-size="14">Remind me when tasks come due</text>
    <text x="320" y="428" font-size="13" class="muted">Notifies while ToDo's is open in a browser tab.</text>
    <text x="320" y="448" font-size="13" class="muted">A task with a date only reminds at 9:00 on that day.</text>
    <text x="320" y="482" font-size="13" class="muted">Remind me</text>
    <rect x="320" y="490" width="608" height="44" rx="6" class="control"/>
    <text x="332" y="517" font-size="14" class="muted">When the task comes due</text>
    <rect x="304" y="558" width="640" height="100" rx="8" class="box"/>
    <text x="320" y="588" font-size="16" class="bold">Data</text>
    <rect x="320" y="602" width="133.92" height="44" rx="6" class="control"/>
    <text x="386.96" y="628.9" font-size="14" text-anchor="middle">Export backup</text>
    <rect x="461.92" y="602" width="133.92" height="44" rx="6" class="control"/>
    <text x="528.88" y="628.9" font-size="14" text-anchor="middle">Import backup</text>
    <rect x="304" y="670" width="640" height="230" rx="8" class="box"/>
    <text x="320" y="700" font-size="16" class="bold">Connection</text>
    <text x="320" y="728" font-size="13">Not connected. Your data stays on this device.</text>
    <text x="320" y="750" font-size="13">Connecting syncs your data across devices and lets you share lists.</text>
    <text x="320" y="772" font-size="13">It needs an account, so you are no longer anonymous. Access is by invitation.</text>
    <text x="320" y="798" font-size="13" class="muted">Server: https://todos.pellicciotta.com</text>
    <rect x="320" y="814" width="86.88" height="44" rx="6" class="primary"/>
    <text x="363.44" y="840.9" font-size="14" class="on-primary" text-anchor="middle">Sign in</text>
    <text x="984" y="140" font-size="13" class="muted">Connected, the Connection section shows the account,</text>
    <text x="984" y="160" font-size="13" class="muted">server, sync state, Sync log, and Disconnect.</text>
    <text x="984" y="188" font-size="13" class="muted">Signing in, not invited, errors, and an expired</text>
    <text x="984" y="208" font-size="13" class="muted">session also show here, in the same section.</text>
    <text x="984" y="236" font-size="13" class="muted">Turning Reminders on asks for notification permission;</text>
    <text x="984" y="256" font-size="13" class="muted">a denial or no support leaves it off and says why.</text>
  </g>
