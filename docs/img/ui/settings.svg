    <text x="40" y="493" font-size="14" class="muted">When the task comes due</text>
    <rect x="12" y="534" width="366" height="100" rx="8" class="box"/>
    <text x="28" y="564" font-size="16" class="bold">Data</text>
    <rect x="28" y="578" width="133.92" height="44" rx="6" class="control"/>
    <text x="94.96" y="604.9" font-size="14" text-anchor="middle">Export backup</text>
    <rect x="169.92" y="578" width="133.92" height="44" rx="6" class="control"/>
    <text x="236.88" y="604.9" font-size="14" text-anchor="middle">Import backup</text>
    <rect x="12" y="646" width="366" height="134" rx="8" class="box"/>
    <text x="28" y="676" font-size="16" class="bold">Connection</text>
    <text x="28" y="704" font-size="13">Not connected. Your data stays on this device.</text>
    <text x="28" y="726" font-size="13">Connecting syncs your data across devices an…</text>
    <text x="28" y="748" font-size="13">It needs an account, so you are no longer an…</text>
    <text x="28" y="774" font-size="13" class="muted">Server: https://todos.pellicciotta.com</text>
    <rect x="0" y="780" width="390" height="64" rx="0" class="bar"/>
    <rect x="88.5" y="794" width="18" height="18" rx="3" class="icon"/>
