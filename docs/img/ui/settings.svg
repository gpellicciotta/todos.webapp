    <text x="80" y="373" font-size="14">Remind me when tasks come due</text>
    <text x="28" y="404" font-size="13" class="muted">Notifies while ToDo's is open in a browser t…</text>
    <text x="28" y="424" font-size="13" class="muted">A task with a date only reminds at 9:00 on t…</text>
    <text x="28" y="458" font-size="13" class="muted">Remind me</text>
