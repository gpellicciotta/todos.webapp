    <text x="28" y="106" font-size="14">All tasks</text>
    <text x="236" y="106" font-size="13" class="muted" text-anchor="end">24</text>
    <text x="28" y="150" font-size="14">Lists</text>
    <text x="44" y="194" font-size="14">Home</text>
    <text x="236" y="194" font-size="13" class="muted" text-anchor="end">8</text>
    <text x="44" y="238" font-size="14">Work</text>
    <text x="236" y="238" font-size="13" class="muted" text-anchor="end">12</text>
    <text x="44" y="282" font-size="14">Travel</text>
    <text x="236" y="282" font-size="13" class="muted" text-anchor="end">3</text>
    <text x="44" y="326" font-size="14">Errands</text>
    <text x="236" y="326" font-size="13" class="muted" text-anchor="end">5</text>
    <text x="44" y="370" font-size="14">Reading</text>
    <text x="236" y="370" font-size="13" class="muted" text-anchor="end">2</text>
    <circle cx="1082" cy="44" r="22" class="icon"/>
    <circle cx="1082" cy="39" r="5" class="icon"/>
    <path d="M 1073 56 Q 1082 40 1091 56" class="icon-line"/>
    <path d="M 1031 52 H 1045 A 5 5 0 0 0 1045 42 A 8 8 0 0 0 1031 44 A 4 4 0 0 0 1031 52 Z" class="icon-line-open"/>
    <text x="304" y="60" font-size="28" class="bold">Settings</text>
    <rect x="304" y="96" width="640" height="100" rx="8" class="box"/>
    <text x="320" y="126" font-size="16" class="bold">Appearance</text>
    <rect x="320" y="140" width="608" height="40" rx="6" class="control"/>
    <rect x="322" y="142" width="198.667" height="36" rx="4" class="selected"/>
    <text x="421.333" y="164.55" font-size="13" class="bold" text-anchor="middle">System</text>
    <text x="624" y="164.55" font-size="13" text-anchor="middle">Light</text>
    <text x="826.667" y="164.55" font-size="13" text-anchor="middle">Dark</text>
    <rect x="304" y="208" width="640" height="100" rx="8" class="box"/>
    <text x="320" y="238" font-size="16" class="bold">Data</text>
    <rect x="320" y="252" width="133.92" height="44" rx="6" class="control"/>
    <text x="386.96" y="278.9" font-size="14" text-anchor="middle">Export backup</text>
    <rect x="461.92" y="252" width="133.92" height="44" rx="6" class="control"/>
    <text x="528.88" y="278.9" font-size="14" text-anchor="middle">Import backup</text>
    <rect x="304" y="320" width="640" height="232" rx="8" class="box"/>
    <text x="320" y="350" font-size="16" class="bold">Connection</text>
    <text x="320" y="378" font-size="13">Not connected. Your data stays on this device.</text>
    <text x="320" y="400" font-size="13" class="muted">Connect to sync devices and share lists.</text>
    <rect x="320" y="416" width="86.88" height="44" rx="6" class="primary"/>
    <text x="363.44" y="442.9" font-size="14" class="on-primary" text-anchor="middle">Connect</text>
    <text x="320" y="490" font-size="13" class="muted">Server URL</text>
    <rect x="320" y="498" width="608" height="44" rx="6" class="control"/>
    <text x="332" y="525" font-size="14">https://todos.pellicciotta.com</text>
    <rect x="304" y="564" width="640" height="72" rx="8" class="box"/>
    <text x="320" y="594" font-size="16" class="bold">About</text>
    <text x="320" y="612" font-size="13" class="muted">Version 1.0.0 · Built 3 Nov 2026</text>
    <text x="984" y="140" font-size="13" class="muted">Connected, the Connection section shows the account,</text>
    <text x="984" y="160" font-size="13" class="muted">server, sync state, Sync log, and Disconnect.</text>
  </g>
</svg>
