<svg xmlns="http://www.w3.org/2000/svg" width="1970" height="1050" viewBox="0 0 1970 1050">
  <title>Sync log wireframe</title>
  <style>
text { font-family: sans-serif; fill: #222222; }
.muted { fill: #666666; }
.on-primary { fill: #ffffff; }
.bold { font-weight: bold; }
rect.frame { fill: #ffffff; stroke: #444444; stroke-width: 2; }
.bar { fill: #eeeeee; stroke: #bbbbbb; }
.box { fill: #f5f5f5; stroke: #bbbbbb; }
.control { fill: #ffffff; stroke: #888888; }
.disabled { fill: #f5f5f5; stroke: #cccccc; }
.primary { fill: #444444; stroke: #444444; }
.selected { fill: #dddddd; stroke: #999999; }
.chip { fill: #eeeeee; stroke: #cccccc; }
.signal { fill: #ffffff; stroke: #222222; stroke-width: 2; }
.scrim { fill: #888888; fill-opacity: 0.5; }
.rule { stroke: #cccccc; }
.drop { stroke: #222222; stroke-width: 3; }
.icon { fill: #ffffff; stroke: #444444; stroke-width: 2; }
.icon-fill { fill: #444444; stroke: #444444; stroke-width: 2; }
.icon-mark { fill: none; stroke: #ffffff; stroke-width: 2; }
.icon-line { stroke: #444444; stroke-width: 2; }
  </style>
  <rect x="0" y="0" width="1970" height="1050" fill="#ffffff"/>
  <text x="40" y="44" font-size="28" class="bold">Sync log</text>
  <text x="40" y="72" font-size="16" class="muted">What conflict resolution overwrote and what the service rejected, with links to the items.</text>
  <text x="40" y="98" font-size="14" class="muted">Compact · 390 px</text>
  <text x="490" y="98" font-size="14" class="muted">Wide · 1440 px</text>
  <g class="frame" data-width="390" data-height="844" transform="translate(40 110)">
    <rect x="0" y="0" width="390" height="844" rx="0" class="frame"/>
    <rect x="0" y="0" width="390" height="60" rx="0" class="bar"/>
    <rect x="8" y="8" width="44" height="44" rx="6" class="control"/>
    <text x="30" y="35" font-size="16" text-anchor="middle">&lt;</text>
    <rect x="338" y="8" width="44" height="44" rx="6" class="control"/>
    <text x="360" y="35" font-size="16" text-anchor="middle">⋮</text>
    <rect x="253.68" y="14" width="76.32" height="32" rx="16" class="control"/>
    <circle cx="267.68" cy="30" r="5" class="icon"/>
    <text x="279.68" y="35" font-size="12">Synced</text>
    <text x="60" y="37" font-size="20" class="bold">Sync log</text>
    <rect x="12" y="76" width="366" height="96" rx="8" class="box"/>
    <text x="28" y="104" font-size="15" class="bold">Overwritten value</text>
    <text x="362" y="104" font-size="12" class="muted" text-anchor="end">Today 09:14</text>
    <text x="28" y="130" font-size="14">Buy paint for the hallway · Due time</text>
    <text x="28" y="154" font-size="13" class="muted">Lost: Fri 10:00 · Kept: Today 18:00</text>
    <rect x="12" y="184" width="366" height="96" rx="8" class="box"/>
    <text x="28" y="212" font-size="15" class="bold">Rejected change</text>
    <text x="362" y="212" font-size="12" class="muted" text-anchor="end">Today 08:02</text>
    <text x="28" y="238" font-size="14">Buy oat milk · in Groceries</text>
    <text x="28" y="262" font-size="13" class="muted">No access anymore; status change undone</text>
    <rect x="12" y="292" width="366" height="96" rx="8" class="box"/>
    <text x="28" y="320" font-size="15" class="bold">Lost access</text>
    <text x="362" y="320" font-size="12" class="muted" text-anchor="end">Today 08:02</text>
    <text x="28" y="346" font-size="14">Groceries, shared by Ann</text>
    <text x="28" y="370" font-size="13" class="muted">2 queued changes were undone</text>
    <rect x="12" y="400" width="366" height="96" rx="8" class="box"/>
    <text x="28" y="428" font-size="15" class="bold">Sync error</text>
    <text x="362" y="428" font-size="12" class="muted" text-anchor="end">Yesterday 22:40</text>
    <text x="28" y="454" font-size="14">Server unavailable</text>
    <text x="28" y="478" font-size="13" class="muted">Retried and synced at 22:45</text>
    <text x="16" y="528" font-size="13" class="muted">Entries stay for 30 days.</text>
    <rect x="0" y="780" width="390" height="64" rx="0" class="bar"/>
    <rect x="39.75" y="794" width="18" height="18" rx="3" class="icon"/>
    <text x="48.75" y="828" font-size="12" text-anchor="middle">Tasks</text>
    <rect x="137.25" y="794" width="18" height="18" rx="3" class="icon"/>
    <text x="146.25" y="828" font-size="12" text-anchor="middle">Lists</text>
    <rect x="234.75" y="794" width="18" height="18" rx="3" class="icon"/>
    <text x="243.75" y="828" font-size="12" text-anchor="middle">Bin</text>
    <rect x="301.25" y="788" width="80" height="48" rx="24" class="selected"/>
    <rect x="332.25" y="794" width="18" height="18" rx="3" class="icon"/>
    <text x="341.25" y="828" font-size="12" class="bold" text-anchor="middle">Settings</text>
  </g>
  <g class="frame" data-width="1440" data-height="900" transform="translate(490 110)">
    <rect x="0" y="0" width="1440" height="900" rx="0" class="frame"/>
    <rect x="0" y="0" width="264" height="900" rx="0" class="bar"/>
    <text x="24" y="46" font-size="22" class="bold">ToDo's</text>
    <text x="28" y="106" font-size="14">All tasks</text>
    <text x="236" y="106" font-size="13" class="muted" text-anchor="end">24</text>
    <text x="28" y="150" font-size="14">Lists</text>
    <text x="44" y="194" font-size="14">Home</text>
    <text x="236" y="194" font-size="13" class="muted" text-anchor="end">8</text>
    <text x="44" y="238" font-size="14">Work</text>
    <text x="236" y="238" font-size="13" class="muted" text-anchor="end">12</text>
    <text x="44" y="282" font-size="14">Travel</text>
    <text x="236" y="282" font-size="13" class="muted" text-anchor="end">3</text>
    <text x="44" y="326" font-size="14">Errands</text>
    <text x="236" y="326" font-size="13" class="muted" text-anchor="end">5</text>
    <text x="44" y="370" font-size="14">Reading</text>
    <text x="236" y="370" font-size="13" class="muted" text-anchor="end">2</text>
    <text x="44" y="414" font-size="14">+ New list</text>
    <line x1="16" y1="724" x2="248" y2="724" class="rule"/>
    <text x="28" y="758" font-size="14">Recycle bin</text>
    <rect x="12" y="776" width="240" height="40" rx="6" class="selected"/>
    <text x="28" y="802" font-size="14" class="bold">Settings</text>
    <rect x="163.68" y="844" width="76.32" height="32" rx="16" class="control"/>
    <circle cx="177.68" cy="860" r="5" class="icon"/>
    <text x="189.68" y="865" font-size="12">Synced</text>
    <text x="304" y="60" font-size="28" class="bold">Sync log</text>
    <text x="304" y="88" font-size="14" class="muted">Values that sync overwrote or undid in the last 30 days.</text>
    <rect x="304" y="116" width="720" height="96" rx="8" class="box"/>
    <text x="320" y="144" font-size="15" class="bold">Overwritten value</text>
    <text x="1008" y="144" font-size="12" class="muted" text-anchor="end">Today 09:14</text>
    <text x="320" y="170" font-size="14">Buy paint for the hallway · Due time</text>
    <text x="320" y="194" font-size="13" class="muted">Lost: Fri 10:00 · Kept: Today 18:00</text>
    <rect x="304" y="224" width="720" height="96" rx="8" class="box"/>
    <text x="320" y="252" font-size="15" class="bold">Rejected change</text>
    <text x="1008" y="252" font-size="12" class="muted" text-anchor="end">Today 08:02</text>
    <text x="320" y="278" font-size="14">Buy oat milk · in Groceries</text>
    <text x="320" y="302" font-size="13" class="muted">No access anymore; status change undone</text>
    <rect x="304" y="332" width="720" height="96" rx="8" class="box"/>
    <text x="320" y="360" font-size="15" class="bold">Lost access</text>
    <text x="1008" y="360" font-size="12" class="muted" text-anchor="end">Today 08:02</text>
    <text x="320" y="386" font-size="14">Groceries, shared by Ann</text>
    <text x="320" y="410" font-size="13" class="muted">2 queued changes were undone</text>
    <rect x="304" y="440" width="720" height="96" rx="8" class="box"/>
    <text x="320" y="468" font-size="15" class="bold">Sync error</text>
    <text x="1008" y="468" font-size="12" class="muted" text-anchor="end">Yesterday 22:40</text>
    <text x="320" y="494" font-size="14">Server unavailable</text>
    <text x="320" y="518" font-size="13" class="muted">Retried and synced at 22:45</text>
  </g>
</svg>
