<svg xmlns="http://www.w3.org/2000/svg" width="1970" height="1050" viewBox="0 0 1970 1050">
  <title>First launch wireframe</title>
  <style>
text { font-family: sans-serif; fill: #222222; }
.muted { fill: #666666; }
.on-primary { fill: #ffffff; }
.bold { font-weight: bold; }
rect.frame { fill: #ffffff; stroke: #444444; stroke-width: 2; }
.bar { fill: #eeeeee; stroke: #bbbbbb; }
.box { fill: #f5f5f5; stroke: #bbbbbb; }
.control { fill: #ffffff; stroke: #888888; }
.disabled { fill: #f5f5f5; stroke: #cccccc; }
.primary { fill: #444444; stroke: #444444; }
.selected { fill: #dddddd; stroke: #999999; }
.chip { fill: #eeeeee; stroke: #cccccc; }
.signal { fill: #ffffff; stroke: #222222; stroke-width: 2; }
.scrim { fill: #888888; fill-opacity: 0.5; }
.rule { stroke: #cccccc; }
.drop { stroke: #222222; stroke-width: 3; }
.icon { fill: #ffffff; stroke: #444444; stroke-width: 2; }
.icon-fill { fill: #444444; stroke: #444444; stroke-width: 2; }
.icon-mark { fill: none; stroke: #ffffff; stroke-width: 2; }
.icon-line { stroke: #444444; stroke-width: 2; }
  </style>
  <rect x="0" y="0" width="1970" height="1050" fill="#ffffff"/>
  <text x="40" y="44" font-size="28" class="bold">First launch</text>
  <text x="40" y="72" font-size="16" class="muted">Local mode with no data: no sign-in, straight to a usable empty state.</text>
  <text x="40" y="98" font-size="14" class="muted">Compact · 390 px</text>
  <text x="490" y="98" font-size="14" class="muted">Wide · 1440 px</text>
  <g class="frame" data-width="390" data-height="844" transform="translate(40 110)">
    <rect x="0" y="0" width="390" height="844" rx="0" class="frame"/>
    <rect x="0" y="0" width="390" height="60" rx="0" class="bar"/>
    <rect x="338" y="8" width="44" height="44" rx="6" class="control"/>
    <text x="360" y="35" font-size="16" text-anchor="middle">⋮</text>
    <rect x="226.8" y="14" width="103.2" height="32" rx="16" class="control"/>
    <circle cx="240.8" cy="30" r="5" class="icon"/>
    <text x="252.8" y="35" font-size="12">Local only</text>
    <text x="16" y="37" font-size="20" class="bold">All tasks</text>
    <circle cx="195" cy="256" r="32" class="icon"/>
    <text x="195" y="328" font-size="20" class="bold" text-anchor="middle">No tasks yet.</text>
    <text x="195" y="356" font-size="15" class="muted" text-anchor="middle">Your tasks stay on this device.</text>
    <rect x="25" y="388" width="149.6" height="44" rx="6" class="control"/>
    <text x="99.8" y="414.9" font-size="14" text-anchor="middle">Import a backup</text>
    <rect x="215.4" y="388" width="149.6" height="44" rx="6" class="control"/>
    <text x="290.2" y="414.9" font-size="14" text-anchor="middle">Connect to sync</text>
    <rect x="0" y="720" width="390" height="60" rx="0" class="bar"/>
    <rect x="326.48" y="728" width="55.52" height="44" rx="6" class="primary"/>
    <text x="354.24" y="754.9" font-size="14" class="on-primary" text-anchor="middle">Add</text>
    <rect x="8" y="728" width="310.48" height="44" rx="6" class="control"/>
    <text x="20" y="755" font-size="14" class="muted">Add a task</text>
    <rect x="0" y="780" width="390" height="64" rx="0" class="bar"/>
    <rect x="8.75" y="788" width="80" height="48" rx="24" class="selected"/>
    <rect x="39.75" y="794" width="18" height="18" rx="3" class="icon"/>
    <text x="48.75" y="828" font-size="12" class="bold" text-anchor="middle">Tasks</text>
    <rect x="137.25" y="794" width="18" height="18" rx="3" class="icon"/>
    <text x="146.25" y="828" font-size="12" text-anchor="middle">Lists</text>
    <rect x="234.75" y="794" width="18" height="18" rx="3" class="icon"/>
    <text x="243.75" y="828" font-size="12" text-anchor="middle">Bin</text>
    <rect x="332.25" y="794" width="18" height="18" rx="3" class="icon"/>
    <text x="341.25" y="828" font-size="12" text-anchor="middle">Settings</text>
  </g>
  <g class="frame" data-width="1440" data-height="900" transform="translate(490 110)">
    <rect x="0" y="0" width="1440" height="900" rx="0" class="frame"/>
    <rect x="0" y="0" width="264" height="900" rx="0" class="bar"/>
    <text x="24" y="46" font-size="22" class="bold">ToDo's</text>
    <rect x="12" y="80" width="240" height="40" rx="6" class="selected"/>
    <text x="28" y="106" font-size="14" class="bold">All tasks</text>
    <text x="236" y="106" font-size="13" class="muted" text-anchor="end">0</text>
    <text x="28" y="150" font-size="14">Lists</text>
    <text x="44" y="190" font-size="13" class="muted">No lists yet</text>
    <text x="44" y="230" font-size="14">+ New list</text>
    <line x1="16" y1="724" x2="248" y2="724" class="rule"/>
    <text x="28" y="758" font-size="14">Recycle bin</text>
    <text x="28" y="802" font-size="14">Settings</text>
    <rect x="12" y="844" width="103.2" height="32" rx="16" class="control"/>
    <circle cx="26" cy="860" r="5" class="icon"/>
    <text x="38" y="865" font-size="12">Local only</text>
    <text x="304" y="60" font-size="28" class="bold">All tasks</text>
    <rect x="304" y="100" width="800" height="60" rx="8" class="bar"/>
    <rect x="1040.48" y="108" width="55.52" height="44" rx="6" class="primary"/>
    <text x="1068.24" y="134.9" font-size="14" class="on-primary" text-anchor="middle">Add</text>
    <rect x="312" y="108" width="720.48" height="44" rx="6" class="control"/>
    <text x="324" y="135" font-size="14" class="muted">Add a task</text>
    <circle cx="704" cy="276" r="32" class="icon"/>
    <text x="704" y="348" font-size="20" class="bold" text-anchor="middle">No tasks yet.</text>
    <text x="704" y="376" font-size="15" class="muted" text-anchor="middle">Your tasks stay on this device.</text>
    <rect x="514" y="408" width="149.6" height="44" rx="6" class="control"/>
    <text x="588.8" y="434.9" font-size="14" text-anchor="middle">Import a backup</text>
    <rect x="744.4" y="408" width="149.6" height="44" rx="6" class="control"/>
    <text x="819.2" y="434.9" font-size="14" text-anchor="middle">Connect to sync</text>
  </g>
</svg>
