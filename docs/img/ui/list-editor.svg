<svg xmlns="http://www.w3.org/2000/svg" width="1970" height="1050" viewBox="0 0 1970 1050">
  <title>List editor wireframe</title>
  <style>
text { font-family: sans-serif; fill: #222222; }
.muted { fill: #666666; }
.on-primary { fill: #ffffff; }
.bold { font-weight: bold; }
rect.frame { fill: #ffffff; stroke: #444444; stroke-width: 2; }
.bar { fill: #eeeeee; stroke: #bbbbbb; }
.box { fill: #f5f5f5; stroke: #bbbbbb; }
.control { fill: #ffffff; stroke: #888888; }
.disabled { fill: #f5f5f5; stroke: #cccccc; }
.primary { fill: #444444; stroke: #444444; }
.selected { fill: #dddddd; stroke: #999999; }
.chip { fill: #eeeeee; stroke: #cccccc; }
.signal { fill: #ffffff; stroke: #222222; stroke-width: 2; }
.scrim { fill: #888888; fill-opacity: 0.5; }
.rule { stroke: #cccccc; }
.drop { stroke: #222222; stroke-width: 3; }
.icon { fill: #ffffff; stroke: #444444; stroke-width: 2; }
.icon-fill { fill: #444444; stroke: #444444; stroke-width: 2; }
.icon-mark { fill: none; stroke: #ffffff; stroke-width: 2; }
.icon-line { stroke: #444444; stroke-width: 2; }
.icon-line-open { fill: none; stroke: #444444; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tooltip { fill: #222222; stroke: #222222; }
  </style>
  <rect x="0" y="0" width="1970" height="1050" fill="#ffffff"/>
  <text x="40" y="44" font-size="28" class="bold">List editor</text>
  <text x="40" y="72" font-size="16" class="muted">Name, description, and sharing; opens where the task editor opens, as a full screen or a right panel.</text>
  <text x="40" y="98" font-size="14" class="muted">Compact · 390 px</text>
  <text x="490" y="98" font-size="14" class="muted">Wide · 1440 px</text>
  <g class="frame" data-width="390" data-height="844" transform="translate(40 110)">
    <rect x="0" y="0" width="390" height="844" rx="0" class="frame"/>
    <rect x="0" y="0" width="390" height="60" rx="0" class="bar"/>
    <rect x="8" y="8" width="44" height="44" rx="6" class="control"/>
    <text x="30" y="35" font-size="16" text-anchor="middle">&lt;</text>
    <circle cx="360" cy="30" r="22" class="icon-fill"/>
    <text x="360" y="35" font-size="14" class="on-primary bold" text-anchor="middle">JD</text>
    <path d="M 309 38 H 323 A 5 5 0 0 0 323 28 A 8 8 0 0 0 309 30 A 4 4 0 0 0 309 38 Z" class="icon-line-open"/>
    <text x="60" y="37" font-size="20" class="bold">List</text>
    <text x="16" y="90" font-size="13" class="muted">Name</text>
    <rect x="16" y="98" width="358" height="44" rx="6" class="control"/>
    <text x="28" y="125" font-size="14">Home</text>
    <text x="16" y="172" font-size="13" class="muted">Description</text>
    <rect x="16" y="180" width="358" height="88" rx="6" class="control"/>
    <text x="28" y="208" font-size="14">Chores and repairs around the house</text>
    <text x="374" y="290" font-size="12" class="muted" text-anchor="end">36 / 1000</text>
    <text x="16" y="320" font-size="12" class="muted">Created 1 Oct · Owner: you</text>
    <text x="16" y="352" font-size="16" class="bold">Sharing</text>
    <text x="16" y="390" font-size="15" class="bold">You</text>
    <text x="374" y="390" font-size="14" class="muted" text-anchor="end">Owner</text>
    <line x1="16" y1="408" x2="374" y2="408" class="rule"/>
    <rect x="330" y="414" width="44" height="44" rx="6" class="control"/>
    <text x="352" y="441" font-size="16" text-anchor="middle">×</text>
    <rect x="196.08" y="414" width="125.92" height="44" rx="6" class="control"/>
    <text x="208.08" y="441" font-size="14">Task editor ▾</text>
    <text x="16" y="441" font-size="15">ann@example.com</text>
    <line x1="16" y1="464" x2="374" y2="464" class="rule"/>
    <rect x="330" y="470" width="44" height="44" rx="6" class="control"/>
    <text x="352" y="497" font-size="16" text-anchor="middle">×</text>
    <rect x="235.28" y="470" width="86.72" height="44" rx="6" class="control"/>
    <text x="247.28" y="497" font-size="14">Viewer ▾</text>
    <text x="16" y="497" font-size="15">ben@example.com</text>
    <text x="16" y="542" font-size="13" class="muted">Invite</text>
    <rect x="16" y="550" width="358" height="44" rx="6" class="control"/>
    <text x="28" y="577" font-size="14" class="muted">Email address</text>
    <rect x="16" y="602" width="258" height="44" rx="6" class="control"/>
    <text x="28" y="629" font-size="14">Task editor ▾</text>
    <rect x="294.96" y="602" width="79.04" height="44" rx="6" class="primary"/>
    <text x="334.48" y="628.9" font-size="14" class="on-primary" text-anchor="middle">Invite</text>
    <line x1="16" y1="666" x2="374" y2="666" class="rule"/>
    <rect x="16" y="686" width="118.24" height="44" rx="6" class="control"/>
    <text x="75.12" y="712.9" font-size="14" text-anchor="middle">Delete list</text>
    <text x="16" y="752" font-size="13" class="muted">Deleting a list never deletes its tasks.</text>
  </g>
  <g class="frame" data-width="1440" data-height="900" transform="translate(490 110)">
    <rect x="0" y="0" width="1440" height="900" rx="0" class="frame"/>
    <rect x="0" y="0" width="264" height="900" rx="0" class="bar"/>
    <rect x="12" y="22" width="44" height="44" rx="6" class="control"/>
    <path d="M 25 37 H 43" class="icon-line-open"/>
    <path d="M 25 44 H 43" class="icon-line-open"/>
    <path d="M 25 51 H 43" class="icon-line-open"/>
    <text x="64" y="52" font-size="22" class="bold">ToDo's</text>
    <text x="28" y="106" font-size="14">All tasks</text>
    <text x="236" y="106" font-size="13" class="muted" text-anchor="end">24</text>
    <text x="28" y="150" font-size="14">Lists</text>
    <rect x="12" y="168" width="240" height="40" rx="6" class="selected"/>
    <text x="44" y="194" font-size="14" class="bold">Home</text>
    <text x="236" y="194" font-size="13" class="muted" text-anchor="end">8</text>
    <text x="44" y="238" font-size="14">Work</text>
    <text x="236" y="238" font-size="13" class="muted" text-anchor="end">12</text>
    <text x="44" y="282" font-size="14">Travel</text>
    <text x="236" y="282" font-size="13" class="muted" text-anchor="end">3</text>
    <text x="44" y="326" font-size="14">Errands</text>
    <text x="236" y="326" font-size="13" class="muted" text-anchor="end">5</text>
    <text x="44" y="370" font-size="14">Reading</text>
    <text x="236" y="370" font-size="13" class="muted" text-anchor="end">2</text>
    <circle cx="978" cy="44" r="22" class="icon-fill"/>
    <text x="978" y="49" font-size="14" class="on-primary bold" text-anchor="middle">JD</text>
    <path d="M 875 52 H 889 A 5 5 0 0 0 889 42 A 8 8 0 0 0 875 44 A 4 4 0 0 0 875 52 Z" class="icon-line-open"/>
