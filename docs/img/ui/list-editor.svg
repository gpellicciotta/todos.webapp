    <text x="352" y="294" font-size="12" class="bold">◷ Overdue</text>
    <line x1="304" y1="378" x2="1000" y2="378" class="rule"/>
    <text x="282" y="340" font-size="14" class="muted">⋮⋮</text>
    <circle cx="326" cy="334" r="9" class="icon"/>
    <text x="352" y="339" font-size="15">Buy paint for the hallway</text>
    <text x="352" y="362" font-size="12" class="muted">◷ Today 18:00</text>
    <rect x="928.96" y="346" width="63.04" height="24" rx="12" class="chip"/>
    <text x="960.48" y="362" font-size="12" text-anchor="middle">Errands</text>
    <line x1="304" y1="446" x2="1000" y2="446" class="rule"/>
    <circle cx="326" cy="402" r="9" class="icon"/>
    <text x="352" y="407" font-size="15">Clean the gutters</text>
    <text x="352" y="430" font-size="12" class="muted">◷ Sat</text>
    <line x1="304" y1="446" x2="1000" y2="446" class="drop"/>
    <line x1="304" y1="494" x2="1000" y2="494" class="rule"/>
    <circle cx="326" cy="470" r="9" class="icon"/>
    <text x="352" y="475" font-size="15">Replace the smoke detector batteries</text>
    <line x1="304" y1="542" x2="1000" y2="542" class="rule"/>
    <circle cx="326" cy="518" r="9" class="icon"/>
    <path d="M326 509 A9 9 0 0 1 326 527 Z" class="icon-fill"/>
    <rect x="329" y="522" width="24.8" height="15" rx="7" class="chip"/>
    <text x="341.4" y="533" font-size="10" class="bold" text-anchor="middle">2/3</text>
    <text x="352" y="523" font-size="15">Sort the winter clothes</text>
    <line x1="304" y1="590" x2="1000" y2="590" class="rule"/>
    <circle cx="326" cy="566" r="9" class="icon"/>
    <text x="352" y="571" font-size="15">Fix the squeaky door</text>
    <line x1="304" y1="638" x2="1000" y2="638" class="rule"/>
    <circle cx="326" cy="614" r="9" class="icon-fill"/>
    <path d="M322 614 l3 3 l5 -6" class="icon-mark"/>
    <text x="352" y="619" font-size="15" class="muted">Paint the garden fence</text>
    <line x1="304" y1="686" x2="1000" y2="686" class="rule"/>
    <circle cx="326" cy="662" r="9" class="icon"/>
    <line x1="321.05" y1="662" x2="330.95" y2="662" class="icon-line"/>
    <text x="352" y="667" font-size="15" class="muted">Buy a new lawn mower</text>
    <line x1="352" y1="662" x2="503.2" y2="662" class="icon-line"/>
    <text x="304" y="718" font-size="13" class="muted">Press and drag a row, or use Alt+Up, Alt+Down, Alt+Home, and Alt+End; the black line marks the drop spot.</text>
    <rect x="1020" y="0" width="420" height="900" rx="0" class="frame"/>
    <text x="1044" y="46" font-size="20" class="bold">List</text>
    <rect x="1380" y="16" width="44" height="44" rx="6" class="control"/>
    <text x="1402" y="43" font-size="16" text-anchor="middle">×</text>
    <text x="1044" y="90" font-size="13" class="muted">Name</text>
    <rect x="1044" y="98" width="372" height="44" rx="6" class="control"/>
    <text x="1056" y="125" font-size="14">Home</text>
    <text x="1044" y="172" font-size="13" class="muted">Description</text>
    <rect x="1044" y="180" width="372" height="88" rx="6" class="control"/>
    <text x="1056" y="208" font-size="14">Chores and repairs around the house</text>
    <text x="1416" y="290" font-size="12" class="muted" text-anchor="end">36 / 1000</text>
    <text x="1044" y="320" font-size="12" class="muted">Created 1 Oct · Owner: you</text>
    <text x="1044" y="352" font-size="16" class="bold">Sharing</text>
    <text x="1044" y="390" font-size="15" class="bold">You</text>
    <text x="1416" y="390" font-size="14" class="muted" text-anchor="end">Owner</text>
    <line x1="1044" y1="408" x2="1416" y2="408" class="rule"/>
    <rect x="1372" y="414" width="44" height="44" rx="6" class="control"/>
    <text x="1394" y="441" font-size="16" text-anchor="middle">×</text>
    <rect x="1238.08" y="414" width="125.92" height="44" rx="6" class="control"/>
    <text x="1250.08" y="441" font-size="14">Task editor ▾</text>
    <text x="1044" y="441" font-size="15">ann@example.com</text>
    <line x1="1044" y1="464" x2="1416" y2="464" class="rule"/>
    <rect x="1372" y="470" width="44" height="44" rx="6" class="control"/>
    <text x="1394" y="497" font-size="16" text-anchor="middle">×</text>
    <rect x="1277.28" y="470" width="86.72" height="44" rx="6" class="control"/>
    <text x="1289.28" y="497" font-size="14">Viewer ▾</text>
    <text x="1044" y="497" font-size="15">ben@example.com</text>
    <text x="1044" y="542" font-size="13" class="muted">Invite</text>
    <rect x="1044" y="550" width="372" height="44" rx="6" class="control"/>
    <text x="1056" y="577" font-size="14" class="muted">Email address</text>
    <rect x="1044" y="602" width="272" height="44" rx="6" class="control"/>
    <text x="1056" y="629" font-size="14">Task editor ▾</text>
    <rect x="1336.96" y="602" width="79.04" height="44" rx="6" class="primary"/>
    <text x="1376.48" y="628.9" font-size="14" class="on-primary" text-anchor="middle">Invite</text>
    <line x1="1044" y1="666" x2="1416" y2="666" class="rule"/>
    <rect x="1044" y="686" width="118.24" height="44" rx="6" class="control"/>
    <text x="1103.12" y="712.9" font-size="14" text-anchor="middle">Delete list</text>
    <text x="1044" y="752" font-size="13" class="muted">Deleting a list never deletes its tasks.</text>
