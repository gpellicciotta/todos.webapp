    <text x="324" y="147" font-size="14" class="muted">Search or add a task</text>
    <text x="312" y="194" font-size="12" class="muted">8 tasks</text>
    <line x1="304" y1="310" x2="1000" y2="310" class="rule"/>
    <circle cx="326" cy="266" r="9" class="icon"/>
    <path d="M326 257 A9 9 0 0 1 326 275 Z" class="icon-fill"/>
